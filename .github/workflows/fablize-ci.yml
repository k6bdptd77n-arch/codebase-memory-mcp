name: fablize-ci
# Procedure-layer CI. Independent of the upstream C workflows (separate filename, scoped
# paths) so it never clashes on `git pull upstream`. Gates the fork's Python layers:
# fablize (incl. crew tests, stdlib-only) and the imba hermes-economizer.
on:
  push:
    paths:
      - 'fablize/**'
      - 'crew/**'
      - 'imba/**'
      - 'install-combined.sh'
      - '.github/workflows/fablize-ci.yml'
  pull_request:
    paths:
      - 'fablize/**'
      - 'crew/**'
      - 'imba/**'
      - 'install-combined.sh'
      - '.github/workflows/fablize-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: fablize test suite (stdlib only, incl. crew tests)
        working-directory: fablize
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: install imba hermes-economizer test deps (lightweight)
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: imba hermes-economizer tests
        run: python -m pytest imba/hermes-economizer/tests -v
