name: mindforge-release
# Builds the packaged MindForge Control app (mac .dmg, linux .AppImage) and attaches them to
# the GitHub Release for a version tag. Dormant until a v* tag is pushed — creating that tag
# is a deliberate release action, not something this workflow does on its own.
# Fork-owned (separate filename + scope), so it never conflicts with upstream C-core CI.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: "mindforge-ui/dist/*.dmg"
          - os: ubuntu-latest
            artifact: "mindforge-ui/dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the C memory engine (bundled as an extraResource)
        run: bash scripts/build.sh --with-ui
      - name: Install and validate UI
        working-directory: mindforge-ui
        run: |
          npm ci
          npm test
          npm run check
      - name: Package (unsigned unless APPLE_* secrets are set — see build/notarize.js)
        working-directory: mindforge-ui
        run: npm run dist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
